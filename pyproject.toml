[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "T20"]
ignore = ["S101", "S603", "S607", "S105", "S110", "S301", "S324", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"backend/app/models/spatial_models.py" = ["N802", "N806", "E501", "UP042"]
"backend/app/routers/api.py" = ["E501"]
"backend/app/routers/auth_router.py" = ["E501", "B904"]
"backend/app/routers/reports_router.py" = ["E501"]
"backend/app/auth.py" = ["B904", "E501"]
"backend/app/config.py" = ["E501"]
"backend/app/db/migrate_json_to_db.py" = ["T201", "E501"]
"backend/app/engines/hazard_engine.py" = ["S110"]
"backend/app/engines/nlg_engine.py" = ["E501"]
"backend/app/engines/vulnerability_engine.py" = ["S110"]
"backend/app/ingestion/real_data_pipeline.py" = ["N806", "E501"]
"backend/app/ml/train.py" = ["N803", "N806", "T201", "B905"]
"backend/app/monitoring/drift_monitor.py" = ["E501"]
"backend/app/monitoring/metrics.py" = []
"backend/app/tasks.py" = ["F841"]
"backend/data/assam/generate_assam_data.py" = ["T201", "S311", "E501", "I001"]
"backend/data/integrate_nrsc_data.py" = ["T201", "S311", "E501", "F841"]
"backend/data/integrate_real_datasets.py" = ["T201", "E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
